<!doctype html>
<html>

<head>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<title>Edit Car Info</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link href="carform.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>

<body class="page-edit">
	<div class="container pt-3">
		<div class="d-flex flex-wrap gap-2 mb-3">
			<a href="index.html" class="btn btn-primary">Search Page</a>
			<a href="index2.html" class="btn btn-primary">Submit Info</a>
		</div>
	</div>

	<h1 class="mb-3">Edit Info</h1>

	<hr />

	<div class="container py-4">
		<p class="text-muted">Select a model link from your database, then update the fields below.</p>

		<div id="edit_result" class="mb-3"></div>

		<div class="card mb-4">
			<div class="card-header">Database Edit Links</div>
			<div class="card-body">
				<div id="edit_links_container" class="table-responsive"></div>
			</div>
		</div>

		<div class="card">
			<div class="card-header">Edit Selected Car</div>
			<div class="card-body">
				<form id="edit_form">
					<div class='row mb-3'>
						<div class='col-md-3'>
							<label for='model_name' class='form-label'>Model Name</label>
						</div>
						<div class='col-md-9'>
							<input type='text' id='model_name' class='form-control' readonly>
							<div id='model_name_error' class='text-danger small mt-1'></div>
						</div>
					</div>

					<div class='row mb-3'>
						<div class='col-md-3'>
							<label for='car_brand' class='form-label'>Car Brand</label>
						</div>
						<div class='col-md-9'>
							<input type='text' id='car_brand' class='form-control'>
							<div id='car_brand_error' class='text-danger small mt-1'></div>
						</div>
					</div>

					<div class='row mb-3'>
						<div class='col-md-3'>
							<label for='horsepower' class='form-label'>Horsepower</label>
						</div>
						<div class='col-md-9'>
							<input type='number' id='horsepower' class='form-control'>
							<div id='horsepower_error' class='text-danger small mt-1'></div>
						</div>
					</div>

					<div class='row mb-3'>
						<div class='col-md-3'>
							<label for='lowest_gas_mileage' class='form-label'>Lowest Gas Mileage</label>
						</div>
						<div class='col-md-9'>
							<input type='number' id='lowest_gas_mileage' class='form-control'>
							<div id='lowest_gas_mileage_error' class='text-danger small mt-1'></div>
						</div>
					</div>

					<div class='row mb-3'>
						<div class='col-md-3'>
							<label for='highest_gas_mileage' class='form-label'>Highest Gas Mileage</label>
						</div>
						<div class='col-md-9'>
							<input type='number' id='highest_gas_mileage' class='form-control'>
							<div id='highest_gas_mileage_error' class='text-danger small mt-1'></div>
						</div>
					</div>

					<div class='row mb-3'>
						<div class='col-md-3'>
							<label for='year_released' class='form-label'>Year Released</label>
						</div>
						<div class='col-md-9'>
							<input type='number' id='year_released' class='form-control'>
							<div id='year_released_error' class='text-danger small mt-1'></div>
						</div>
					</div>

					<div class='row mb-3'>
						<div class='col-md-3'>
							<label for='lowest_price' class='form-label'>Lowest Price</label>
						</div>
						<div class='col-md-9'>
							<input type='number' id='lowest_price' class='form-control'>
							<div id='lowest_price_error' class='text-danger small mt-1'></div>
						</div>
					</div>

					<div class='row mb-3'>
						<div class='col-md-3'>
							<label for='highest_price' class='form-label'>Highest Price</label>
						</div>
						<div class='col-md-9'>
							<input type='number' id='highest_price' class='form-control'>
							<div id='highest_price_error' class='text-danger small mt-1'></div>
						</div>
					</div>

					<div class='row mb-3'>
						<div class='col-md-12'>
							<button type='submit' class='btn btn-primary'>Update Car Info</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script>
		const editResult = document.getElementById('edit_result');
		const editForm = document.getElementById('edit_form');

		const getLoadingOverlay = () => {
			let overlay = document.getElementById('loading_overlay');
			if (!overlay) {
				overlay = document.createElement('div');
				overlay.id = 'loading_overlay';
				overlay.className = 'loading-overlay hidden';
				overlay.innerHTML =
					'<div class="tire-spinner-wrap">' +
						'<div class="tire-spinner" aria-hidden="true"></div>' +
						'<div class="tire-spinner-label">Preparing request...</div>' +
					'</div>';
				document.body.appendChild(overlay);
			}
			return overlay;
		};

		const showLoadingOverlay = () => {
			getLoadingOverlay().classList.remove('hidden');
		};

		const hideLoadingOverlay = () => {
			const overlay = document.getElementById('loading_overlay');
			if (overlay) {
				overlay.classList.add('hidden');
			}
		};

		const hasErrors = (json) => {
			if (!json || typeof json.errors === 'undefined' || json.errors === null) {
				return false;
			}
			if (Array.isArray(json.errors)) {
				return json.errors.length > 0;
			}
			if (typeof json.errors === 'object') {
				return Object.keys(json.errors).length > 0;
			}
			return Boolean(json.errors);
		};

		const showMessage = (message, isSuccess) => {
			editResult.innerHTML = '<div class="alert ' + (isSuccess ? 'alert-success' : 'alert-danger') + '">' + message + '</div>';
		};

		const editFieldIds = ['model_name', 'car_brand', 'horsepower', 'lowest_gas_mileage', 'highest_gas_mileage', 'year_released', 'lowest_price', 'highest_price'];

		const clearFieldErrors = () => {
			for (const fieldId of editFieldIds) {
				const errorEl = document.getElementById(fieldId + '_error');
				const fieldEl = document.getElementById(fieldId);
				if (errorEl) {
					errorEl.textContent = '';
				}
				if (fieldEl) {
					fieldEl.classList.remove('is-invalid');
				}
			}
		};

		const renderFieldErrors = (errors) => {
			if (!errors || typeof errors !== 'object') {
				return;
			}
			for (const [fieldName, message] of Object.entries(errors)) {
				const errorEl = document.getElementById(fieldName + '_error');
				const fieldEl = document.getElementById(fieldName);
				if (errorEl) {
					errorEl.textContent = message;
				}
				if (fieldEl) {
					fieldEl.classList.add('is-invalid');
				}
			}
		};

		const loadEditLinks = async () => {
			try {
				const response = await fetch('/cars?limit=100');
				const json = await response.json();
				if (response.status !== 200 || typeof json.data === 'undefined') {
					document.getElementById('edit_links_container').innerHTML = '<div class="text-danger">Could not load database links.</div>';
					return;
				}

				let html = '<table class="table table-sm table-striped">' +
					'<thead><tr><th>Model</th><th>Brand</th><th>Link</th></tr></thead><tbody>';

				for (const row of json.data) {
					const id = encodeURIComponent(row.car_attributes_id);
					html += '<tr>' +
						'<td>' + row.model_name + '</td>' +
						'<td>' + row.car_brand + '</td>' +
						'<td><a href="index3.html?id=' + id + '">Edit This Car</a></td>' +
						'</tr>';
				}

				html += '</tbody></table>';
				document.getElementById('edit_links_container').innerHTML = html;
			} catch (error) {
				document.getElementById('edit_links_container').innerHTML = '<div class="text-danger">Could not load database links.</div>';
			}
		};

		const loadSelectedCar = async () => {
			const params = new URLSearchParams(window.location.search);
			const selectedId = params.get('id');
			if (!selectedId) {
				return;
			}

			try {
				const response = await fetch('/cars/' + encodeURIComponent(selectedId));
				const json = await response.json();
				if (response.status !== 200 || !json.data || json.data.length === 0) {
					showMessage('Selected car was not found.', false);
					return;
				}

				const row = json.data[0];
				document.getElementById('model_name').value = row.model_name;
				document.getElementById('car_brand').value = row.car_brand;
				document.getElementById('horsepower').value = row.horsepower;
				document.getElementById('lowest_gas_mileage').value = row.lowest_gas_mileage;
				document.getElementById('highest_gas_mileage').value = row.highest_gas_mileage;
				document.getElementById('year_released').value = row.year_released;
				document.getElementById('lowest_price').value = row.lowest_price;
				document.getElementById('highest_price').value = row.highest_price;
			} catch (error) {
				showMessage('Could not load selected car.', false);
			}
		};

		editForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			clearFieldErrors();
			editResult.innerHTML = '';

			const params = new URLSearchParams(window.location.search);
			const selectedId = params.get('id');
			if (!selectedId) {
				showMessage('Select a car from the links table before submitting.', false);
				return;
			}

			const payload = {
				car_brand: document.getElementById('car_brand').value.trim(),
				horsepower: document.getElementById('horsepower').value.trim(),
				lowest_gas_mileage: document.getElementById('lowest_gas_mileage').value.trim(),
				highest_gas_mileage: document.getElementById('highest_gas_mileage').value.trim(),
				year_released: document.getElementById('year_released').value.trim(),
				lowest_price: document.getElementById('lowest_price').value.trim(),
				highest_price: document.getElementById('highest_price').value.trim()
			};

			showLoadingOverlay();
			await new Promise((resolve) => setTimeout(resolve, 5000));
			hideLoadingOverlay();

			try {
				const response = await fetch('/cars/' + encodeURIComponent(selectedId), {
					method: 'PUT',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(payload)
				});

				const json = await response.json();
				if (response.status === 200 && !hasErrors(json)) {
					showMessage(json.message || 'Car updated successfully.', true);
					await loadEditLinks();
				} else {
					renderFieldErrors(json.errors);
					const errorMessage = hasErrors(json)
						? (json.message || 'Please correct the highlighted fields.')
						: json.message;
					showMessage(errorMessage || 'Update failed.', false);
				}
			} catch (error) {
				showMessage('Could not connect to server.', false);
			}
		});

		loadEditLinks();
		loadSelectedCar();
	</script>
</body>

</html>
